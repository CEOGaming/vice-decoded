# Zentrale Einstellungen für Vice Decoded
[channel]
name = "Vice Decoded"
language = "de"            # "de" oder "en"
voice_de = "de-DE-ConradNeural"
voice_en = "en-US-GuyNeural"
elevenlabs_voice_id = "FTNCalFNG5bRnkkaP5Ug"   # Otto (vom Owner gewählt)
elevenlabs_model = "eleven_v3"
elevenlabs_stability = 0.5      # v3: 0.0 kreativ, 0.5 natürlich, 1.0 stabil
elevenlabs_style = 0.3

[scout]
game_name = "Grand Theft Auto VI"
hours_back = 24            # wie weit zurück gesucht wird
twitch_pages = 3            # je 100 Clips
min_twitch_views_de = 150   # deutsche Clips schon ab weniger Views
german_bonus = 6            # deutsche Clips etwas höher bewerten
youtube_query = "GTA 6"
youtube_max_results = 25
min_twitch_views = 500     # Clips mit weniger Views ignorieren

# Deutsche Streamer, deren GTA-6-Clips immer geprüft werden (Twitch-Login)
watchlist = [
  "montanablack88", "trymacs", "papaplatte", "rewinside", "handofblood", "knossi",
  "unsympathischtv", "eligella", "tanzverbot", "noway4u_sir", "mckytv", "revedtv",
  "staiy", "rumathra", "zarbex", "dhalucard", "sidneyeweka", "gronkh", "pietsmiet",
  "shurjoka", "bonjwa", "dner", "unge", "letshugotv", "aminematue", "elotrix",
  "jinkoo", "hungriger_hugo", "fritz_berger", "lostkittn", "scurrows", "eskay",
]

[produce]
max_source_seconds = 12    # maximal so viele Sekunden Fremdmaterial am Stück
max_video_seconds = 90     # Story-Format 65–80 s, viral 20–35 s
width = 1080
height = 1920
original_audio_volume = 0.18   # Original leise unter der KI-Stimme (falls Trennung nicht klappt)
separate_game_audio = true      # Streamer-Stimme per KI entfernen, nur Spielsound unter den Kommentar
game_audio_volume = 0.35       # Lautstärke Spielsound unter der KI-Stimme
font = "Bangers"           # Untertitel-Schrift (Google Fonts, OFL), wird im Workflow installiert
caption_style = "single"    # "single" = ein Wort pro Einblendung (Stil virale Shorts), "group" = 2–3 Wörter
caption_size = 84
caption_margin = 560        # Abstand Untertitel vom unteren Rand (Mitte ~69 % der Höhe)
hook_size = 90
layout = "full"            # "full" = Vollbild 9:16 (Standard), "fill" = Bild füllt den Screen, "fit" = alter Streifen, "split" = oben Webcam/unten Gameplay
fill_height = 0.58         # Anteil der Bildhöhe fürs Gameplay im fill-Layout (vorher 0.70)
split_top = 0.40           # Anteil der Höhe für die Webcam im split-Layout
brand = ""
sfx = true
sfx_volume = 0.5
show_credit = false        # Quelle steht in der Beschreibung

# Aussprache nur für die Stimme. Gleiche Wortanzahl links und rechts,
# damit die Untertitel den Originaltext zeigen können.
[pronounce]
"GTA 6" = "Ge-Te-A sechs"
"GTA 5" = "Ge-Te-A fünf"
"GTA VI" = "Ge-Te-A sechs"
"PS5" = "Pe-Es-fünf"
"xQc" = "Ex-Kju-Si"
