name: Täglicher Scout

on:
  schedule:
    - cron: "20 5,11,17 * * *"   # 6:20, 12:20, 18:20 Uhr deutscher Winterzeit
  workflow_dispatch:
    inputs:
      analyze_count:
        description: "Wie viele Top-Clips analysiert werden"
        default: "8"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Scout
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/scout.py
      - name: Analyse der Top-Clips
        run: python src/analyze.py ${{ github.event.inputs.analyze_count || 30 }}
      - name: Ergebnis speichern
        run: |
          git config user.name "vice-decoded-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json data/analysis
          git diff --cached --quiet || git commit -m "Scout: neue Kandidaten und Analysen"
          git pull --rebase && git push
