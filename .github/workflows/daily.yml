name: Täglicher Scout

on:
  schedule:
    - cron: "0 6,14 * * *"   # 7 und 15 Uhr deutscher Winterzeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scout laufen lassen
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/scout.py
      - name: Ergebnis speichern
        run: |
          git config user.name "vice-decoded-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json
          git diff --cached --quiet || git commit -m "Scout: neue Kandidaten"
          git push

  produce:
    needs: scout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - run: pip install -r requirements.txt
      - name: Neue Skripte rendern
        run: |
          shopt -s nullglob
          for s in scripts/*.json; do
            id=$(basename "$s" .json)
            [ "$id" = "test_demo" ] && continue
            [ -f "output/$id/$id.mp4" ] || python src/produce.py "$s"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: videos-zur-abnahme
          path: output/**/*
          retention-days: 7
