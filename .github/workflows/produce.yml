name: Videos produzieren

on:
  push:
    branches: [main]
    paths: ["scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt demucs soundfile
      - name: Neue Skripte rendern
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          shopt -s nullglob
          mkdir -p /tmp/fertig
          for s in scripts/*.json; do
            id=$(basename "$s" .json)
            [ "$id" = "test_demo" ] && continue
            [ -f "review/$id/$id.mp4" ] && continue
            python src/produce.py "$s"
            mkdir -p "/tmp/fertig/$id"
            cp "output/$id/$id.mp4" "output/$id/meta.json" "/tmp/fertig/$id/"
          done
      - name: Zur Abnahme ablegen
        run: |
          git config user.name "vice-decoded-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p review
            cp -r /tmp/fertig/. review/ 2>/dev/null || true
            git add review
            git diff --cached --quiet && exit 0
            git commit -q -m "Neue Videos zur Abnahme"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
