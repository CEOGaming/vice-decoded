name: Rohclips holen (Beispielvideos)

on:
  push:
    branches: [claude/project-thread-dsg4l7]
    paths: ["fetch/urls.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - run: |
          set -e
          mkdir -p fetch/raw
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; *[!a-zA-Z0-9_-]*) echo "bad name"; exit 1;; esac
            yt-dlp -q -f "best[height<=1080]/best" -o "fetch/raw/$name.mp4" -- "$url"
          done < fetch/urls.txt
          ls -la fetch/raw
      - run: |
          git config user.name "vice-decoded-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f fetch/raw
          git commit -m "Rohclips für Beispielvideos"
          git push
