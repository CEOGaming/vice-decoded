name: Gezielte Clip-Suche

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name der Suche (Datei data/search/<name>.json)"
        required: true
      words:
        description: "Stichwörter im Clip-Titel, mit Komma getrennt"
        required: true
      hours:
        description: "Zeitraum in Stunden"
        default: "72"
      count:
        description: "Wie viele Treffer analysiert werden"
        default: "12"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Suche
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python src/search_clips.py "${{ inputs.name }}" "${{ inputs.words }}" "${{ inputs.hours }}" "${{ inputs.count }}"
      - name: Ergebnis speichern
        run: |
          git config user.name "vice-decoded-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git add data/search data/analysis
            git diff --cached --quiet && break
            git commit -qm "Suche: ${{ inputs.name }}" && git pull --rebase -q && git push -q && break
            sleep 5
          done
