name: Recherche Gaming-Shorts

on:
  workflow_dispatch:
    inputs:
      set:
        default: "gta6"
      days:
        default: "14"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SET: ${{ github.event.inputs.set }}
          DAYS: ${{ github.event.inputs.days }}
        run: python src/research.py
      - run: |
          git config user.name "vice-decoded-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research
          git diff --cached --quiet || git commit -m "Recherche: Gaming-Shorts"
          git pull --rebase && git push
